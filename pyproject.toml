[project]
name = "carlinpedia"
version = "0.1.0"
description = "A personal George Carlin library with idea-level search, served to Claude over MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=1.8",
    "mcp>=2.2,<3",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.15",
]

[project.scripts]
carlin = "carlinpedia.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carlinpedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: loads the real embedding model or calls external services"]
