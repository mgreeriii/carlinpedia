    - {slug: society.family, name: Family, description: The family as an institution and its sacred status.}
    - {slug: society.sports, name: Sports, description: Games, fans, and the language and values of competition.}
    - {slug: society.celebrity, name: Celebrity, description: The worship of famous people for being famous.}
