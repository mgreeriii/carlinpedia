    - {slug: power.politicians, name: Politicians, description: Elected officials as a reflection of the people who elect them.}
    - {slug: power.owners-and-class, name: The owners and class, description: The wealthy few who own the country and the system that serves them.}
    - {slug: power.voting-and-democracy, name: Voting and democracy, description: Elections as a ritual that gives the illusion of choice.}
    - {slug: power.patriotism, name: Patriotism and flag-waving, description: National pride as a substitute for thought.}
    - {slug: power.war-and-militarism, name: War and militarism, description: The national love of war, weapons, and bombing people.}
    - {slug: power.government-control, name: Government control, description: Authorities expanding control in the name of safety or order.}
- slug: money
