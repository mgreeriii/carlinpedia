  children:
    - {slug: money.consumerism, name: Consumerism, description: Shopping as identity, purpose, and pastime.}
    - {slug: money.stuff, name: Stuff and possessions, description: People's attachment to their things and the need for places to keep them.}
    - {slug: money.corporate-greed, name: Corporate greed, description: Companies putting profit above people, safety, and honesty.}
    - {slug: money.advertising-and-marketing, name: Advertising and marketing, description: The industry that manufactures desire and sells it back.}
    - {slug: money.american-dream, name: The American Dream, description: The promise of prosperity used to keep people working and quiet.}
