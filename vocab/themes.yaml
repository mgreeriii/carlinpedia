# Controlled theme hierarchy. Edit freely before the first ingest.
# Slugs are stable identifiers: changing one orphans its old links.
- slug: language
  name: Language
  description: How words are used to hide, soften, inflate, or sell.
  children:
    - {slug: language.euphemism, name: Euphemism, description: Pleasant words substituted for blunt ones to avoid facing reality.}
    - {slug: language.soft-language, name: Soft language, description: Language drained of feeling so that pain and consequence disappear.}
    - {slug: language.jargon, name: Jargon and bureaucratese, description: Inflated institutional language that sounds important and says little.}
    - {slug: language.political-correctness, name: Political correctness, description: Policing words in place of addressing the thing the words describe.}
    - {slug: language.cliches, name: Clichés and empty phrases, description: Stock phrases people repeat without thinking about what they mean.}
    - {slug: language.advertising-language, name: Advertising language, description: The vocabulary of selling, where every product is new, improved, and essential.}
- slug: power
  name: Power and politics
