- slug: human-nature
  name: Human nature
  description: Durable features of how people think and behave.
  children:
    - {slug: human-nature.hypocrisy, name: Hypocrisy, description: Saying one thing and doing another, publicly and without shame.}
    - {slug: human-nature.self-deception, name: Self-deception, description: The lies people tell themselves to stay comfortable.}
    - {slug: human-nature.stupidity, name: Stupidity, description: The sheer number of people who don't think, and what that costs.}
    - {slug: human-nature.fear-and-safety, name: Fear and safety obsession, description: A culture terrified of germs, risk, and anything unfamiliar.}
    - {slug: human-nature.selfishness, name: Selfishness, description: Everyone looking out for themselves and calling it virtue.}
    - {slug: human-nature.violence, name: Violence, description: The human appetite for cruelty and destruction.}
    - {slug: human-nature.arrogance, name: Human arrogance, description: The belief that humans are special, central, or in charge of the planet.}
